name: Build Windows Binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-msvc:
    name: Compile Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile with MSVC
        shell: cmd
        run: |
          cl.exe /nologo /O2 /EHsc /Fe:NFS_Endless_Horizon.exe main.cpp /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib opengl32.lib glu32.lib winmm.lib

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFS_Endless_Horizon-Windows-x64
          path: NFS_Endless_Horizon.exe
